[project]
name = "vastlora"
version = "0.1.0"
description = "Reproducible VAST-LoRA diagnostic and asynchronous FL research pipeline."
readme = "VAST_LoRA_Research_Guide_12_Weeks.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "transformers>=4.40",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
scale = [
    "accelerate>=1.2",
    "bitsandbytes>=0.45",
    "peft>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
