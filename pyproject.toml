[project]
name = "vastlora"
version = "0.1.0"
description = "Week-2 research foundation for VAST-LoRA."
readme = "VAST_LoRA_Research_Guide_12_Weeks.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
